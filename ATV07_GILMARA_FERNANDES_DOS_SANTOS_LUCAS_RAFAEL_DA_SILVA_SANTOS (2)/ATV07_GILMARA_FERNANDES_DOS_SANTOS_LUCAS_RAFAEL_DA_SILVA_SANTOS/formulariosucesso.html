<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <link rel="icon" type="image/x-icon" href="img/favicon.ico">

    <style>
        body {
            background-image: url('img/background.jpeg');   /*Responsável por alterar a imagem do fundo da página*/
            background-repeat: no-repeat;   /*Responsável por não permitir que a imagem se repita no fundo*/
            background-attachment: fixed;   /*Responsável por deixar a imagem fixa, sem que acompanhe o rolamento do mouse*/
            background-size: cover;     /*Responsável por alterar o tamanho da imagem de fundo, fazendo com que ela preencha todo o fundo*/
            font-family: Arial;     /*Responsável por alterar a fonte dos textos de toda a página*/
        }
        header {
            border-collapse: collapse;  /*Responsável por determinar o modelo das bordas do bloco, nesse caso uma borda de linha única*/
            width: 70%; /*Responsável por alterar a largura do bloco*/
            margin: auto;   /*Responsável por deixar o bloco centralizado*/
            height: 100px;  /*Responsável por alterar a altura do bloco*/
            background-color: #03BB85;  /*Responsável por alterar a cor de fundo do bloco*/
            border: 2px solid black;    /*Responsável por determinar a largura e cor da borda dos blocos*/
            text-align: center; /*Responsável por determinar a posição dos textos dentro dos blocos*/
            color: black;   /*Responsável por determinar a cor padrão do texto dos blocos*/
        }
        #mensagem{
            border-collapse: collapse;  /*Responsável por determinar o modelo das bordas do bloco, nesse caso uma borda de linha única*/
            width: 70%; /*Responsável por alterar a largura do bloco*/
            margin: auto;   /*Responsável por deixar o bloco centralizado*/
            height: auto;  /*Responsável por alterar a altura do bloco*/
            padding-top: 30px; /*Responsável por distanciar o texto do topo do bloco*/
            background-color: #FFFFFF;  /*Responsável por alterar a cor de fundo do bloco*/
            border: 2px solid black;    /*Responsável por determinar a largura e cor da borda dos blocos*/
            text-align: center; /*Responsável por determinar a posição dos textos dentro dos blocos*/
            color: black;   /*Responsável por determinar a cor padrão do texto dos blocos*/
        }

    </style>

</head>

<body>
    <header>
        <h1>FORMULÁRIO ENVIADO!</h1>
    </header>
    <div id="mensagem">
    </div>
    <script>
        const parametros = new URLSearchParams(window.location.search);
        const nome = parametros.get("nome");
        const email = parametros.get("email");

        document.getElementById("mensagem").innerHTML = 
        `Obrigado por nos contatar, <strong>${nome}</strong>! O formulário foi entregue com sucesso.<br>
        Aguarde uma mensagem no email: ${email}`;
    </script>
    

</body>
</html>
